[package]
name = "rusty-pomodoro-overlay"
version = "0.1.0"
edition = "2024"
description = "Pomodoro-Timer als randloses Overlay für Windows 11"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
raw-window-handle = "0.6"
skrifa = { version = "0.44", default-features = false, features = ["std", "autohint_shaping"] }
toml_edit = "0.25"
tray-icon = { version = "0.26", default-features = false }
vello_cpu = { version = "0.2", default-features = false, features = ["std", "u8_pipeline", "f32_pipeline"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
