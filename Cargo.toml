[package]
name = "rusty-pomodoro-overlay"
version = "0.1.0"
edition = "2024"
description = "Pomodoro-Timer als randloses Overlay für Windows 11"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
raw-window-handle = "0.6"
toml_edit = "0.25"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
