# PROTOTYP – Wegwerf-Code für das Ticket "Overlay-Spike mit der gewählten Technik".
# Nicht weiterentwickeln; die validierten Entscheidungen wandern in die SPEC.md.
[package]
name = "overlay-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
